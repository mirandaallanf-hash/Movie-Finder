<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💘</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  overflow-x: hidden;
  padding: 15px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  width: 100%;
  max-width: 360px;
}

h1 {
  color: #e63946;
  margin-bottom: 12px;
  font-size: 22px;
}

/* FOTO */
.photo {
  width: 100%;
  height: 190px;
  border-radius: 20px;
  background: #f1f1f1;
  margin-bottom: 15px;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* BOTONES */
button {
  padding: 14px 20px;
  margin: 8px 5px;
  font-size: 16px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  width: 90%;
}

.yes {
  background: #e63946;
  color: white;
}

.no {
  background: #adb5bd;
  color: white;
  position: relative;
}

/* CORAZONES */
.heart {
  position: absolute;
  color: red;
  font-size: 18px;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-100vh); opacity: 0; }
}

.big-heart {
  font-size: 56px;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.4); }
}

/* INVITACIÓN */
.invite {
  font-size: 15px;
  color: #333;
  line-height: 1.6;
}

.invite strong {
  color: #e63946;
  font-size: 17px;
}
</style>
</head>

<body>

<div class="card">
  <div class="photo">
    <!-- CAMBIA AQUÍ LA RUTA DE LA FOTO -->
    <img src="TU_FOTO_AQUI.jpg" alt="Nuestra foto">
  </div>

  <h1 id="text">¿Quieres ser mi Valentine? 💖</h1>

  <div id="buttons">
    <button class="yes" onclick="yesMain()">Sí 💘</button>
    <button class="no" id="noBtn" onclick="noMain()">No 😢</button>
  </div>
</div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<script>
function playClick() {
  document.getElementById("clickSound").play();
}

/* BOTÓN NO SE MUEVE */
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("touchstart", () => {
  const x = Math.random() * 120 - 60;
  const y = Math.random() * 120 - 60;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

/* FLUJOS */
function noMain() {
  playClick();
  document.getElementById("text").innerText = "¿Estás segura? 🤨";
  document.getElementById("buttons").innerHTML = `
    <button class="yes" onclick="sureYes()">Sí</button>
    <button class="no" onclick="backHome()">No</button>
  `;
}

function sureYes() {
  playClick();
  document.getElementById("text").innerText = "Again… ¿estás segura? 😏";
}

function backHome() {
  location.reload();
}

function yesMain() {
  playClick();

  document.getElementById("text").innerHTML = "💌 Invitación Especial 💌";

  document.getElementById("buttons").innerHTML = `
    <div class="invite">
      <p><strong>14 de febrero de 2026</strong></p>
      <p>Desde las <strong>17:00</strong></p>
      <p>
        Reserva tus planes 💕<br>
        Tengo algo muy especial preparado para nosotros ✨
      </p>

      <a href="https://calendar.google.com/calendar/render?action=TEMPLATE
      &text=Valentine+Date+💘
      &dates=20260214T170000/20260214T220000
      &details=Reserva+tus+planes,+tenemos+una+cita+especial+✨
      &sf=true&output=xml"
      target="_blank">
        <button class="yes">📅 Añadir a mi calendario</button>
      </a>

      <span class="big-heart">❤️</span>
    </div>
  `;

  hearts();
}

/* CORAZONES */
function hearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 16 + 14 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 350);
}
</script>

</body>
</html>
