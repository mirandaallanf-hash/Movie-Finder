<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💘</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  overflow-x: hidden;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  width: 90%;
  max-width: 360px;
  position: relative;
}

h1 {
  color: #e63946;
  margin-bottom: 15px;
  font-size: 22px;
}

/* BOTONES */
button {
  padding: 14px 20px;
  margin: 8px 5px;
  font-size: 16px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  width: 90%;
  transition: transform 0.3s;
}

.yes {
  background: #e63946;
  color: white;
}

.no {
  background: #adb5bd;
  color: white;
  position: absolute;
}

/* MENSAJE TROLL */
#trollMsg {
  font-size: 14px;
  color: #e63946;
  margin-top: 12px;
  display: none;
}

/* CORAZONES */
.heart {
  position: absolute;
  font-size: 18px;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-100vh); opacity: 0; }
}

.big-heart {
  font-size: 60px;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.4); }
}

.invite {
  font-size: 15px;
  color: #333;
  line-height: 1.6;
}

.invite strong {
  color: #e63946;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 id="text">¿Quieres ser mi Valentine? 💖</h1>

  <div id="buttons">
    <button class="yes" id="yesBtn" onclick="yesMain()">Sí 💘</button>
    <button class="no" id="noBtn">No 😢</button>
  </div>

  <p id="trollMsg"></p>
</div>

<audio id="trollSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");
const trollMsg = document.getElementById("trollMsg");
const trollSound = document.getElementById("trollSound");

let scale = 1;

const messages = [
  "jaja buen intento 😜",
  "nop 😏",
  "casi… pero no 😂",
  "no tan fácil 😈",
  "solo hay una opción 💘"
];

function moveNoButton() {
  const cardRect = card.getBoundingClientRect();
  const x = Math.random() * (cardRect.width - 120);
  const y = Math.random() * (cardRect.height - 60);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  trollMsg.innerText = messages[Math.floor(Math.random() * messages.length)];
  trollMsg.style.display = "block";

  trollSound.currentTime = 0;
  trollSound.play();

  if (navigator.vibrate) {
    navigator.vibrate(100);
  }

  scale += 0.1;
  yesBtn.style.transform = `scale(${scale})`;

  clearTimeout(trollMsg.timer);
  trollMsg.timer = setTimeout(() => {
    trollMsg.style.display = "none";
  }, 1200);
}

/* ACTIVADORES */
noBtn.addEventListener("mouseover", moveNoButton);
noBtn.addEventListener("mousedown", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);

function yesMain() {
  document.getElementById("text").innerHTML = "💌 Invitación Especial 💌";

  document.getElementById("buttons").innerHTML = `
    <div class="invite">
      <p><strong>14 de febrero de 2026</strong></p>
      <p>Desde las <strong>17:00</strong></p>
      <p>
        Reserva tus planes 💕<br>
        Tengo algo muy especial preparado para nosotros ✨
      </p>

      <span class="big-heart">❤️</span>
    </div>
  `;

  hearts();
}

function hearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 16 + 14 + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
  }, 300);
}
</script>

</body>
</html>
